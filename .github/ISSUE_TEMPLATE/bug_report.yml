name: Bug Report
description: Report a reproducible problem in BAKABOOST
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem.

        **Do not report security vulnerabilities here.**
        Follow the private reporting instructions in `SECURITY.md`.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Clearly describe the problem.
      placeholder: What happened?
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Go to...
        2. Perform...
        3. Observe...
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected Area
      options:
        - Applicant verification
        - Discord OAuth
        - Evidence submission
        - Admin authentication
        - Admin review
        - Team and invitations
        - Discord access
        - Audit logging
        - Frontend
        - Backend API
        - Deployment / infrastructure
        - Other
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, operating system, deployment environment, or other relevant details.

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add sanitized logs or screenshots if useful. Never include credentials, tokens, identity evidence, or private user data.

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I have removed credentials, tokens, private identity evidence, and other sensitive data from this report.
          required: true
        - label: This is not a security vulnerability.
          required: true
